services:
  database:
    restart: unless-stopped
    image: postgres-pgx-ulid
    build:
      context: .
      dockerfile: database.dockerfile # ig we're updating to postgres 18! :>
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 1s
      retries: 5
    environment:
      - POSTGRES_USER=luyin
      - POSTGRES_PASSWORD=luyin
      - POSTGRES_DB=luyin
    volumes:
      - db:/var/lib/postgresql

volumes:
  db: